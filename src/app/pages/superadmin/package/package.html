<div class="card">
    <div class="font-semibold text-xl mb-4">Package Management</div>
    
    <!-- Search and Filter Section -->
    <div class="flex justify-content-between align-items-center mb-4 gap-3">
        <!-- Left: Search -->
        <div class="flex-1">
            <p-iconField iconPosition="left">
                <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
                <input 
                    pInputText 
                    type="text" 
                    placeholder="Search packages..." 
                    (input)="onGlobalFilter($event)"
                    class="w-full"
                    #searchInput>
            </p-iconField>
        </div>
        
        <!-- Right: Filter and Add Button -->
        <div class="flex align-items-center gap-2">
            <!-- <p-dropdown 
                [options]="statusOptions" 
                [(ngModel)]="selectedStatus" 
                placeholder="Filter by Status"
                optionLabel="label" 
                optionValue="value"
                [showClear]="true"
                (onChange)="onStatusFilter($event)"
                class="w-12rem">
            </p-dropdown> -->
            
            <p-button 
                label="Add Package" 
                icon="pi pi-plus" 
                (onClick)="addPackage()"
                severity="success">
            </p-button>
        </div>
    </div>

    <!-- Table -->
    <p-table 
        #dt
        [value]="packages" 
        [globalFilterFields]="['name', 'price', 'duration', 'maxBranch']"
        sortField="name" 
        sortMode="single" 
        [scrollable]="true"
        scrollHeight="400px" 
        [tableStyle]="{ 'min-width': '60rem' }"
        [loading]="loading"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">
        
        <ng-template #header>
            <tr>
                <th scope="col" pSortableColumn="name">
                    Name <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th scope="col" pSortableColumn="price">
                    Price <p-sortIcon field="price"></p-sortIcon>
                </th>
                <th scope="col" pSortableColumn="duration">
                    Duration (Days) <p-sortIcon field="duration"></p-sortIcon>
                </th>
                <th scope="col" pSortableColumn="maxBranch">
                    Max Branch <p-sortIcon field="maxBranch"></p-sortIcon>
                </th>
                <th scope="col" pSortableColumn="is_active">
                    Status <p-sortIcon field="is_active"></p-sortIcon>
                </th>
                <th scope="col" style="width: 150px;">Actions</th>
            </tr>
        </ng-template>
        
        <ng-template #body let-package let-rowIndex="rowIndex">
            <tr>
                <td>
                    <strong>{{ package.name }}</strong>
                </td>
                <td>
                    <span class="font-semibold">${{ package.price | number:'1.2-2' }}</span>
                </td>
                <td>
                    {{ package.duration }} days
                </td>
                <td>
                    <p-tag 
                        [value]="package.maxBranch.toString()" 
                        [severity]="package.maxBranch > 50 ? 'success' : package.maxBranch > 10 ? 'warning' : 'info'">
                    </p-tag>
                </td>
                <td>
                    <p-tag 
                        [value]="package.is_active === 'Y' ? 'Active' : 'Inactive'" 
                        [severity]="package.is_active === 'Y' ? 'success' : 'danger'">
                    </p-tag>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button 
                            icon="pi pi-pencil" 
                            [text]="true" 
                            [rounded]="true" 
                            severity="info" 
                            size="small"
                            (click)="editPackage(package)"
                            pTooltip="Edit Package">
                        </p-button>
                        <p-button 
                            icon="pi pi-trash" 
                            [text]="true" 
                            [rounded]="true" 
                            severity="danger" 
                            size="small"
                            (click)="deletePackage(package)"
                            pTooltip="Delete Package">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
        
        <ng-template #empty>
            <tr>
                <td colspan="6" class="text-center py-6">
                    <div class="text-500">
                        <i class="pi pi-inbox text-4xl mb-3"></i>
                        <p class="text-lg">No packages found</p>
                        <p class="text-sm">Try adjusting your search or filter criteria</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
