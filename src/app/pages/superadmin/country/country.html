<div class="card">
    <div class="font-semibold text-xl mb-4">Country</div>
    <p-table [value]="countries" sortField="representative.name" sortMode="single" [scrollable]="true"
        scrollHeight="400px" rowGroupMode="subheader" groupRowsBy="representative.name"
        [tableStyle]="{ 'min-width': '60rem' }">
        <ng-template #header>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Code</th>
                <th scope="col">Phone code</th>
                <th scope="col">Currency</th>
                <th scope="col">Status</th>
            </tr>
        </ng-template>
        
        
        <ng-template #body let-country let-rowIndex="rowIndex">
            <tr>
                <td>
                    {{ country.name }}
                </td>
                <td>
                    {{ country.code }}
                </td>
                <td>
                    {{ country.phone_code }}
                </td>
                <td>
                    {{ country.currency }}
                </td>
                <td>
                    {{ country.is_active }}
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
