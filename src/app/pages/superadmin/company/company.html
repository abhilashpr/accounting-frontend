<div class="card">
    <div class="font-semibold text-xl mb-4">Package</div>
    <p-table [value]="companies" sortField="representative.name" sortMode="single" [scrollable]="true"
        scrollHeight="400px" rowGroupMode="subheader" groupRowsBy="representative.name"
        [tableStyle]="{ 'min-width': '60rem' }">
        <ng-template #header>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Price</th>
                <th scope="col">Duration</th>
                <th scope="col">Max Branch</th>
                <th scope="col">Status</th>
            </tr>
        </ng-template>
        
        
        <ng-template #body let-company let-rowIndex="rowIndex">
            <tr>
                <td>
                    {{ company.name }}
                </td>
                <td>
                    {{ company.price }}
                </td>
                <td>
                    {{ company.duration }}
                </td>
                <td>
                    {{ company.maxBranch }}
                </td>
                <td>
                    {{ company.is_active }}
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
