<div class="card">
    <div class="font-semibold text-xl mb-4">Package</div>
    <p-table [value]="cities" sortField="representative.name" sortMode="single" [scrollable]="true"
        scrollHeight="400px" rowGroupMode="subheader" groupRowsBy="representative.name"
        [tableStyle]="{ 'min-width': '60rem' }">
        <ng-template #header>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Country</th>
                <th scope="col">State</th>
                <th scope="col">Status</th>
                <th scope="col">Actions</th>
            </tr>
        </ng-template>
        
        
        <ng-template #body let-city let-rowIndex="rowIndex">
            <tr>
                <td>
                    {{ city.name }}
                </td>
                <td>
                    {{ city.country.name }}
                </td>
                <td>
                    {{ city.state.name }}
                </td>
                <td>
                    {{ city.is_active }}
                </td>
                <td>

                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
