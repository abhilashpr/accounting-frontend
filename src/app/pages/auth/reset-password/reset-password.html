<app-floating-configurator />
<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <!-- Here Logo -->
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Reset Password</div>
                    <span class="text-muted-color font-medium">Create a new secure password for your account</span>
                </div>
                <div>
                    <div class="mb-6">
                        <label for="newPassword" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">New Password</label>
                        <div class="relative">
                            <input 
                                pInputText 
                                id="newPassword" 
                                [type]="showNewPassword ? 'text' : 'password'"
                                [(ngModel)]="newPassword" 
                                placeholder="Enter new password"
                                class="w-full md:w-120 pr-12"
                                (input)="checkPasswordMatch()" />
                            <button 
                                type="button" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-muted-color hover:text-surface-700 dark:hover:text-surface-300"
                                (click)="toggleNewPassword()">
                                <i class="pi" [ngClass]="showNewPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <label for="confirmPassword" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Confirm Password</label>
                        <div class="relative">
                            <input 
                                pInputText 
                                id="confirmPassword" 
                                [type]="showConfirmPassword ? 'text' : 'password'"
                                [(ngModel)]="confirmPassword" 
                                placeholder="Confirm new password"
                                class="w-full md:w-120 pr-12"
                                (input)="checkPasswordMatch()" />
                            <button 
                                type="button" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-muted-color hover:text-surface-700 dark:hover:text-surface-300"
                                (click)="toggleConfirmPassword()">
                                <i class="pi" [ngClass]="showConfirmPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-6" *ngIf="passwordMismatch && confirmPassword.length > 0">
                        <small class="text-red-500">Passwords do not match</small>
                    </div>
                    
                    <p-button 
                        label="Reset Password" 
                        styleClass="w-full mb-6" 
                        (onClick)="resetPassword()" 
                        [loading]="isLoading"
                        [disabled]="!isFormValid()">
                    </p-button>
                    
                    <div class="text-center">
                        <span class="font-medium cursor-pointer text-primary hover:underline" routerLink="/auth/login">Back to Login</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
